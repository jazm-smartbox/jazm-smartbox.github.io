<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://api.github.com data: blob:; frame-ancestors 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#F3F6FB">
<title>MySmartBox</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* Layout: one column, sticky header with tabs; plan view is a drawing sheet with pins */
:root{
  --bg:#ECEFED; --surface:#FFFFFF; --surface2:#F4F6F5; --ink:#141B1A; --muted:#5F6C69; --line:#DDE3E1;
  --accent:#2456E0; --accent-ink:#FFFFFF; --accent-soft:#E3EAFC; --ok:#1F9D63;
  --shadow:0 1px 2px rgba(20,27,26,.06),0 4px 14px rgba(20,27,26,.05);
  --sl:#E0631C; --sl-soft:#FBE7DA; --ew:#0E8C83; --ew-soft:#D7F0EC; --other:#6B5BB8; --other-soft:#E8E4F6;
  --c4:#C23A6B; --c4-soft:#F8DEE8; --c5:#A86A00; --c5-soft:#F6EBD3; --c6:#3F6E8C; --c6-soft:#DCE8EF;
  --danger:#C2362B; --grid:rgba(31,85,214,.08);
  --f-display:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-body:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono:ui-monospace, "Roboto Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B100F; --surface:#151C1B; --surface2:#1C2523; --ink:#EAF0EE; --muted:#94A39F; --line:#253130;
  --accent:#8AAEFF; --accent-ink:#0B1530; --accent-soft:#1A2747; --ok:#4FD69A;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.25);
  --sl:#FF9A5C; --sl-soft:#3A2618; --ew:#4FD1C5; --ew-soft:#123430; --other:#B3A6F2; --other-soft:#28233F;
  --c4:#FF8DB5; --c4-soft:#3A1E2A; --c5:#F2B84B; --c5-soft:#352914; --c6:#8EC3E3; --c6-soft:#18303D;
  --danger:#FF7A6E; --grid:rgba(125,162,255,.09); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B100F; --surface:#151C1B; --surface2:#1C2523; --ink:#EAF0EE; --muted:#94A39F; --line:#253130;
  --accent:#8AAEFF; --accent-ink:#0B1530; --accent-soft:#1A2747; --ok:#4FD69A;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.25);
  --sl:#FF9A5C; --sl-soft:#3A2618; --ew:#4FD1C5; --ew-soft:#123430; --other:#B3A6F2; --other-soft:#28233F;
  --c4:#FF8DB5; --c4-soft:#3A1E2A; --c5:#F2B84B; --c5-soft:#352914; --c6:#8EC3E3; --c6-soft:#18303D;
  --danger:#FF7A6E; --grid:rgba(125,162,255,.09); color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 0}
.wrap{max-width:860px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font:750 1.45rem/1.1 var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:4px;margin-top:12px}
.tab{background:none;border:0;padding:10px 14px;border-bottom:2px solid transparent;color:var(--muted);font-weight:600;cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}

main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 96px}

.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger);border-color:currentColor;background:none}
.btn.small{padding:6px 10px;font-size:.85rem}

.summary{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:.8rem;font-weight:600;white-space:nowrap}
[data-c="sl"]{--c:var(--sl);--cs:var(--sl-soft)} [data-c="ew"]{--c:var(--ew);--cs:var(--ew-soft)} [data-c="other"]{--c:var(--other);--cs:var(--other-soft)}
[data-c="c4"]{--c:var(--c4);--cs:var(--c4-soft)} [data-c="c5"]{--c:var(--c5);--cs:var(--c5-soft)} [data-c="c6"]{--c:var(--c6);--cs:var(--c6-soft)}
.chip{background:var(--cs,var(--bg));color:var(--c,var(--muted))}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.filterchip{border:1px solid var(--line);background:var(--surface);cursor:pointer}
.filterchip[aria-pressed="true"]{border-color:currentColor}

.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tools input,.tools select{flex:1 1 160px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px}

.banner{background:var(--accent-soft);border-radius:10px;padding:10px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px;font-size:.9rem}

.room{margin-bottom:18px}
.room h2{font:600 .78rem/1 var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px;display:flex;justify-content:space-between}
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.dev{display:flex;align-items:center;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}
.dev:first-child{border-top:0}
.devmain{flex:1;min-width:0;display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:center;text-align:left;background:none;border:0;padding:0;cursor:pointer}
.devmain:hover .name{color:var(--accent)}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.open{display:inline-flex;align-items:center;gap:4px;font-size:.8rem;font-weight:600;color:var(--c,var(--accent));text-decoration:none;border:1px solid currentColor;border-radius:8px;padding:4px 9px;white-space:nowrap}
.open svg{width:13px;height:13px}
.voices{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.voice{display:inline-flex;align-items:center;gap:4px;font-size:.76rem;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 7px;cursor:pointer;color:var(--ink);max-width:100%;text-align:left}
.voice svg{width:12px;height:12px;flex:none;color:var(--muted)}
.applist .roomrow{flex-wrap:wrap}
.swatches{display:flex;gap:6px}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid transparent;background:var(--c);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{border-color:var(--ink)}
.linkin{flex:1 1 100%;font-family:var(--f-mono);font-size:.8rem;border:1px solid var(--line)!important;background:var(--bg)!important}
h2.sec{font:600 .78rem/1 var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:22px 0 8px}
h2.sec:first-child{margin-top:0}
.ico{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--bg);color:var(--ink)}
.ico svg{width:22px;height:22px}
.dev .name{font-weight:600;min-width:0;overflow-wrap:anywhere}
.dev .meta{color:var(--muted);font-size:.82rem;min-width:0;overflow-wrap:anywhere}
.mono{font-family:var(--f-mono);font-size:.78rem}
.ex{font-size:.7rem;color:var(--muted);border:1px dashed var(--line);border-radius:4px;padding:0 5px;margin-left:6px;font-weight:500}

.empty{text-align:center;padding:40px 16px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px}
.empty strong{display:block;color:var(--ink);font:600 1.1rem var(--f-display);margin-bottom:6px}

/* Plan */
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;position:relative}
.planbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.planbar select{flex:1 1 200px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px}
.hint{font-size:.85rem;color:var(--muted);margin:0 0 10px}
.canvas{position:relative;border-radius:8px;overflow:hidden;background:
  linear-gradient(var(--grid) 1px,transparent 1px) 0 0/20px 20px,
  linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/20px 20px,var(--bg)}
.canvas.placing{cursor:crosshair;outline:2px dashed var(--accent);outline-offset:-2px}
.canvas img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.canvaswrap{container-type:inline-size;overflow:auto;border-radius:8px;-webkit-overflow-scrolling:touch}
.canvaswrap .canvas{width:calc(100% * var(--z,1))}
.pin{--ps:clamp(16px,3.4cqw,28px);position:absolute;transform:translate(-50%,calc(-1 * var(--ps) * .92));display:flex;flex-direction:column;align-items:center;border:0;background:none;padding:0;cursor:pointer;z-index:1}
.pin .head{width:var(--ps);height:var(--ps);border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:grid;place-items:center;color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.pin .head svg{width:62%;height:62%;transform:rotate(45deg)}
.pin .lbl{display:none}
.canvas.labels .pin .lbl,.pin.active .lbl{display:block}
.pin.active{z-index:2}
.pin{touch-action:none;user-select:none;-webkit-user-select:none}
.pin.dragging{z-index:3;opacity:.85;cursor:grabbing}
.pin.dragging .head{transform:rotate(-45deg) scale(1.25)}
.zoom{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.zoom button{border:0;background:var(--surface);padding:6px 10px;font-size:.85rem;font-weight:600;cursor:pointer;border-left:1px solid var(--line)}
.zoom button:first-child{border-left:0}
.zoom button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;cursor:pointer}
.pin .head{background:var(--c,var(--other))}
.pin .lbl{margin-top:3px;background:var(--surface);color:var(--ink);font-size:clamp(9px,1.7cqw,12px);font-weight:600;padding:0 5px;border-radius:4px;border:1px solid var(--line);white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis}
.pin.active .head{outline:3px solid var(--accent);outline-offset:2px}

.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:0;border:2px solid var(--ink);border-radius:4px}
.rtile{border:1px solid var(--ink);min-height:120px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.rtile .rn{font:600 .72rem var(--f-mono);text-transform:uppercase;letter-spacing:.06em}
.rtile .cnt{font-size:.75rem;color:var(--muted)}
.minis{display:flex;flex-wrap:wrap;gap:4px}
.mini{font-size:.72rem;border-radius:4px;padding:1px 6px;border:0;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini{background:var(--cs);color:var(--c)}
.unplaced{margin-top:14px}
.unplaced h3{font-size:.85rem;margin:0 0 6px}

/* Rooms tab */
.roomrow{display:flex;gap:8px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.roomrow:first-child{border-top:0}
.roomrow input{flex:1;min-width:0;border:1px solid transparent;background:none;border-radius:6px;padding:6px 8px}
.roomrow input:focus{border-color:var(--line);background:var(--bg)}
.roomrow .n{color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.addroom{display:flex;gap:8px;margin-top:10px}
.addroom input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px}
.filebtn{position:relative;overflow:hidden;display:inline-flex;align-items:center}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;font-size:0}
.filebtn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.floors{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.floorbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;cursor:pointer}
.floorbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.note{font-size:.85rem;color:var(--muted);margin-top:18px;max-width:60ch}

.fab{position:fixed;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(env(safe-area-inset-bottom,0px) + 20px);z-index:6;
  background:var(--accent);color:var(--accent-ink);border:0;border-radius:14px;padding:14px 18px;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.22);cursor:pointer;display:flex;gap:8px;align-items:center}

/* Editor sheet */
.overlay{position:fixed;inset:0;background:rgba(10,15,14,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--surface);width:100%;max-width:520px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:18px calc(18px + env(safe-area-inset-bottom,0px))}
@media (min-width:600px){.overlay{align-items:center}.panel{border-radius:16px}}
.panel h2{font:750 1.2rem var(--f-display);margin:0 0 14px}
.form{display:grid;gap:12px}
.field{display:grid;gap:4px;min-width:0}
.field label{font-size:.8rem;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 12px;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.two{grid-template-columns:1fr}}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 auto;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;cursor:pointer;font-weight:500}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.actions{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-top:6px}
.actions .r{display:flex;gap:8px;margin-left:auto}
.confirm{background:var(--bg);border-radius:8px;padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.9rem}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 86px);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:.88rem;z-index:30}
.sync{font-size:.75rem;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.panel{animation:up .18s ease-out}@keyframes up{from{transform:translateY(20px);opacity:.6}}}

/* ===== Redesign ===== */
body::before{background:var(--bg)}
header.hero{position:static;background:none;border:0;padding-block:22px 6px}
.eyebrow{font:600 .72rem var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{font-size:2rem;margin-top:2px}
.sync{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:.72rem;white-space:nowrap}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow);min-width:0}
.stat b{display:block;font:750 1.7rem/1.05 var(--f-display);font-variant-numeric:tabular-nums}
.stat span{font-size:.76rem;color:var(--muted)}
.dist{display:flex;gap:3px;height:8px;margin-top:14px}
.dist i{background:var(--c);border-radius:999px;min-width:8px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:.76rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend span::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}

.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:8;display:flex;justify-content:space-around;
  background:color-mix(in srgb,var(--surface) 90%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.bottomnav .tab{flex:1;max-width:160px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px 10px;border:0;background:none;font-size:.72rem;font-weight:600;color:var(--muted);cursor:pointer}
.bottomnav .tab .pill{display:grid;place-items:center;width:56px;height:30px;border-radius:999px;transition:background .15s}
.bottomnav .tab svg{width:22px;height:22px}
.bottomnav .tab[aria-selected="true"]{color:var(--ink)}
.bottomnav .tab[aria-selected="true"] .pill{background:var(--accent-soft);color:var(--accent)}
main{padding-block:10px 150px}
.fab{bottom:calc(env(safe-area-inset-bottom,0px) + 78px);border-radius:18px;padding:14px 20px;box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 35%,transparent)}
.toast{bottom:calc(env(safe-area-inset-bottom,0px) + 150px);border-radius:12px;box-shadow:var(--shadow)}

.btn{border-radius:12px}
.btn.small{border-radius:10px}
.banner{border-radius:16px;padding:12px 14px}

.summary{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-2px;padding:2px}
.summary::-webkit-scrollbar{display:none}
.filterchip{padding:7px 13px;font-size:.82rem;background:var(--surface);color:var(--c);border:1px solid var(--line)}
.filterchip[aria-pressed="true"]{background:var(--cs);border-color:var(--c)}
.search{position:relative;flex:1 1 180px;min-width:0;display:flex}
.search svg{position:absolute;left:14px;top:50%;width:18px;height:18px;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.tools .search input{flex:1;padding-left:40px}
.tools input,.tools select{border-radius:999px;padding:10px 16px;background:var(--surface)}

.room{margin-bottom:22px}
.room h2{align-items:center;margin-bottom:10px;padding-inline:4px}
.room h2 span:last-child{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-size:.72rem;letter-spacing:0;color:var(--ink)}
.room .list{background:none;border:0;border-radius:0;display:grid;gap:8px;overflow:visible}
@media (min-width:720px){.room .list{grid-template-columns:1fr 1fr}}
.room .dev{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:12px;flex-wrap:wrap;box-shadow:var(--shadow);min-width:0}
.room .dev:first-child{border-top:1px solid var(--line)}
.devmain{grid-template-columns:46px 1fr}
.ico{width:46px;height:46px;border-radius:15px;background:var(--cs,var(--surface2));color:var(--c,var(--ink))}
.ico svg{width:24px;height:24px}
.dev .name{font-size:1rem}
.side{gap:8px}
.open{border:0;background:var(--cs);color:var(--c);border-radius:999px;padding:6px 12px}
.dev .voices{flex-basis:100%;padding-left:58px;margin-top:2px}
.voice{border-radius:999px;padding:3px 10px;background:var(--surface2);border-color:transparent}

.list{border-radius:18px;box-shadow:var(--shadow)}
.sheet{border-radius:20px;box-shadow:var(--shadow);padding:14px}
.canvas{border-radius:12px}
.canvaswrap{border-radius:12px}
.floors{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;display:inline-flex;gap:4px;box-shadow:var(--shadow)}
.floorbtn{border:0;background:none;padding:8px 16px}
.floorbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.planbar select{border-radius:999px;padding:10px 16px}
.zoom{border-radius:999px}
.zoom button{padding:7px 12px}
.rooms{border-radius:12px;overflow:hidden}
.panel{border-radius:24px 24px 0 0}
@media (min-width:600px){.panel{border-radius:24px}}
.field input,.field select,.field textarea{border-radius:12px}

.roomFloorSel{border:1px solid var(--line);background:var(--surface2);padding:5px 6px;font-size:.8rem;max-width:112px}
.optrow{display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-size:.9rem}
.optrow input{width:20px;height:20px;accent-color:var(--ink)}
.bkrow{gap:8px;flex-wrap:wrap}
.confirm2{flex-wrap:wrap;font-size:.86rem;background:var(--accent-soft)}
.confirm2 .r2{display:flex;gap:6px;margin-left:auto}
body.no-pattern .bgfx.pcbwrap{display:none!important}
body.no-anim .pcb .sig{display:none}
.rrow{display:grid!important;grid-template-columns:minmax(0,1fr) auto auto;column-gap:8px;row-gap:0;align-items:center}
.rrow input{grid-column:1;grid-row:1}
.rrow .roomFloorSel{grid-column:2;grid-row:1}
.rrow .btn{grid-column:3;grid-row:1}
.rrow .n{grid-column:1;grid-row:2;padding-left:8px;font-size:.72rem}
.lbadge{display:inline-flex;align-items:center;justify-content:center;height:15px;min-width:15px;padding:0 4px;font-size:.6rem;font-weight:800;letter-spacing:.03em;background:var(--ink);color:#fff;vertical-align:1px;line-height:1}
.lbadge.limg{padding:0;width:16px;height:16px;object-fit:contain;background:#fff;border:1px solid var(--line)}
.lbadge.big{height:28px;min-width:28px;font-size:.72rem;flex:none}
.lbadge.big.limg{width:28px;height:28px}
.lrow{display:grid!important;grid-template-columns:auto minmax(0,1fr) auto auto auto;column-gap:8px;align-items:center}
.lrow .n{grid-column:2;grid-row:2;padding-left:8px;font-size:.72rem}
.lrow input{grid-column:2;grid-row:1}
.grpv{flex:1 1 100%;margin-top:6px;border:1px solid var(--line);background:var(--surface2);padding:8px 10px;font:inherit;font-size:.84rem;resize:vertical;min-width:0}
.list .roomrow:has(.grpv){flex-wrap:wrap}
.gvoice{display:flex;flex-wrap:wrap;gap:4px;margin:-2px 2px 8px}
.gvoice .voice{background:#fff;border:1px solid var(--line)}
.rrow .roomCircSel{grid-column:2/4;grid-row:2;justify-self:end;border:1px solid var(--line);background:var(--surface2);padding:4px 6px;font-size:.76rem;max-width:200px;margin-top:4px}
.circ.inh{opacity:.7}
.crow{display:grid!important;grid-template-columns:auto minmax(0,1fr) auto;column-gap:10px;align-items:center}
.crow .n{grid-column:2/4;grid-row:2;padding-left:8px;font-size:.72rem}
.cno{font-weight:800;font-size:.86rem;min-width:36px;font-variant-numeric:tabular-nums}
.cnoin{flex:0 0 64px!important;min-width:0}
.acc{white-space:normal!important;display:block!important;background:#fff;border:0;margin-bottom:12px;min-width:0;box-shadow:0 2px 4px rgba(43,42,39,.07),0 12px 28px rgba(43,42,39,.12)!important}
.acc > .acchd{display:flex!important;width:100%!important}
.acc > .accbody{min-width:0}
.acchd{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;width:100%;padding:14px 14px;cursor:pointer;font:700 1rem/1.2 var(--f-display);color:var(--ink)}
.acchd:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.acchd span:first-child{flex:1}
.acnt{font:600 .78rem var(--f-body);color:var(--muted);font-variant-numeric:tabular-nums}
.acchd svg{width:18px;height:18px;color:var(--muted);transition:transform .15s;transform:rotate(-90deg)}
.acc.open .acchd svg{transform:none}
.accbody{display:none;padding:0 12px 12px}
.acc.open .accbody{display:block}
.accbody > .list{box-shadow:none!important}
.accbody > .note:last-child{margin-bottom:0}
.accbody > .sbars{box-shadow:none!important;border:1px solid var(--line2)}
.accbody > .sbars + *{margin-top:0}
.room.closed{background:#fff;padding:6px 12px 12px;margin-bottom:12px;box-shadow:0 2px 4px rgba(43,42,39,.07),0 12px 28px rgba(43,42,39,.12)!important}
.room.closed h2{margin-bottom:0}
.room.closed .sechd{padding:10px 2px 4px}
.room.closed .secsum{padding:0 2px;color:var(--muted)}
.sbig{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;padding-block:8px;margin-top:-8px;background:var(--bg);box-shadow:0 8px 10px -8px rgba(43,42,39,.18)!important}
.kpis{border-color:transparent!important;box-shadow:0 2px 4px rgba(43,42,39,.07),0 12px 28px rgba(43,42,39,.12)!important}
.pgrp{z-index:2}
.pin.active,.pgrp:has(.pin.active){z-index:3}

/* Beschriftungen: umbrechen statt abschneiden */
.pin .lbl{white-space:normal;width:max-content;max-width:30cqw;text-align:center;line-height:1.25;overflow:visible;text-overflow:clip;overflow-wrap:anywhere;padding:1px 5px}
.glbl{white-space:normal;width:max-content;max-width:46cqw;text-align:center;line-height:1.25;padding:1px 5px}
.lbl,.glbl{pointer-events:none}

/* ===== Spielereien ===== */
.sync.blip{animation:blip .9s ease-out}
@keyframes blip{0%{color:#E2691F}100%{color:inherit}}
.pcb .pulse path{filter:drop-shadow(0 0 3px #E2691F)}
.qrscan{position:relative;flex:none;display:grid;place-items:center;width:44px;margin-left:6px;background:#fff;border:1px solid var(--line);color:var(--ink);cursor:pointer}
.qrscan svg{position:static!important;transform:none!important;width:22px!important;height:22px!important;color:var(--ink)!important}
.qrscan input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.qrrow select{flex:1;min-width:0;padding:8px;border:1px solid var(--line);background:#fff;font:inherit}
.dl{position:absolute;inset:0;pointer-events:none;z-index:0}
.dl-tint{position:absolute;inset:0;mix-blend-mode:multiply;transition:background 1s}
.dl-glow{position:absolute;inset:0;mix-blend-mode:screen}
.sunb{position:absolute;top:4px;transform:translateX(-50%);z-index:2;display:flex;align-items:center;gap:3px;border:0;background:rgba(255,255,255,.85);outline:1px solid var(--line);padding:3px;cursor:pointer;color:#E2A01F;font:600 11px/1 Manrope,system-ui,sans-serif}
.sunb.night{background:rgba(30,36,80,.85);color:#F4E9C8;outline-color:rgba(255,255,255,.25)}
.sunb svg{width:18px;height:18px}
.sunb span{color:inherit;padding-right:3px}
.radarclip{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:1}
.radar{position:absolute;width:44%;aspect-ratio:1;transform:translate(-50%,-50%);pointer-events:none;z-index:1}
.radar::before,.radar::after,.radar i{content:"";position:absolute;inset:0;border-radius:50%!important}
.radar i{background:conic-gradient(from 0deg,rgba(226,105,31,0) 0deg,rgba(226,105,31,0) 290deg,rgba(226,105,31,.45) 360deg);animation:sweep 1.1s linear 3,fadeout 3.3s forwards}
.radar::before{border:1.5px solid rgba(226,105,31,.6);animation:ring 1.1s ease-out 3}
.radar::after{border:1.5px solid rgba(226,105,31,.45);animation:ring 1.1s ease-out .4s 3;opacity:0}
@keyframes sweep{to{transform:rotate(360deg)}}
@keyframes ring{0%{transform:scale(.05);opacity:1}100%{transform:scale(1);opacity:0}}
@keyframes fadeout{80%{opacity:1}100%{opacity:0}}
.canvas.finding .pin:not(.flash){opacity:.3;transition:opacity .3s}
.canvas.finding .pgrp:not(:has(.flash)){opacity:.5}
@media (prefers-reduced-motion:reduce){.radar{display:none}}
.ozones{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.ozones polygon{fill:rgba(18,20,38,.58);stroke:#C8361D;stroke-width:1.6;stroke-dasharray:5 4;vector-effect:non-scaling-stroke;animation:flicker 1.1s steps(1) both}
@keyframes flicker{0%{opacity:0}12%{opacity:.9}20%{opacity:.2}32%{opacity:1}40%{opacity:.4}55%,100%{opacity:1}}
.pin.off .head{filter:grayscale(1) brightness(.75);outline:2px solid #C8361D!important;animation:offblink 1.6s ease-in-out infinite}
@keyframes offblink{50%{outline-color:rgba(200,54,29,.15)}}
.canvas.outage .pin:not(.off){opacity:.9}
.canvas.poweron::after{content:"";position:absolute;inset:0;background:rgba(255,236,170,.55);pointer-events:none;z-index:3;animation:pon .9s ease-out forwards}
@keyframes pon{0%{opacity:0}15%{opacity:1}100%{opacity:0}}
.outhint{background:#131C2B!important;color:#fff!important;border-color:#131C2B!important}
.outhint b{color:#FFB59E}
.outhint small{opacity:.75}
.outhint button{background:#FFD25E!important;color:#131C2B!important;border:0!important;font-weight:700}
.outbtn{color:#C8361D}
/* Was fällt aus: Karte statt Textblock */
.outcard{--oc-bg:#131C2B;--oc-ink:#FFFFFF;--oc-mut:rgba(255,255,255,.62);--oc-line:rgba(255,255,255,.14);--oc-red:#FF8A70;--oc-yel:#FFD25E;
  background:var(--oc-bg);color:var(--oc-ink);margin:0 0 10px;font-size:.86rem}
.oc-hd{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 12px}
.oc-fuse{flex:none;display:flex;flex-direction:column;align-items:center;gap:3px;width:44px;padding:5px 0 4px;border:1.5px solid var(--oc-red);color:var(--oc-red)}
.oc-fuse b{font:700 .78rem/1 var(--f-mono);letter-spacing:.02em}
.oc-lever{width:10px;height:18px;border:1.5px solid currentColor;position:relative}
.oc-lever::after{content:"";position:absolute;left:1px;right:1px;bottom:1px;height:7px;background:currentColor}
.oc-tt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.oc-tt small{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--oc-red)}
.oc-tt b{font-weight:650;font-size:.92rem;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.oc-on{flex:none;display:inline-flex;align-items:center;gap:5px;border:0;background:var(--oc-yel);color:#131C2B;font-weight:700;font-size:.84rem;padding:9px 12px;cursor:pointer}
.oc-on svg{width:15px;height:15px}
.oc-kpis{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));border-top:1px solid var(--oc-line)}
.oc-k{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:1px;padding:10px 12px;min-width:0;position:relative}
.oc-k + .oc-k{border-left:1px solid var(--oc-line)}
.oc-k b{font:700 1.35rem/1.05 var(--f-display);font-variant-numeric:tabular-nums}
.oc-k span{font-size:.76rem;line-height:1.3;color:var(--oc-mut);overflow-wrap:anywhere}
.oc-k > svg{position:absolute;top:11px;right:9px;width:14px;height:14px;color:var(--oc-mut);transition:transform .15s}
.oc-k[aria-expanded="true"] > svg{transform:rotate(180deg)}
.oc-k.off b{color:var(--oc-red)}
.oc-k.un b{color:#FFC2B3}
.oc-k[aria-expanded="true"]{background:rgba(255,255,255,.07)}
.oc-k[aria-expanded="true"]::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--oc-yel)}
.oc-k:focus-visible{outline:2px solid var(--oc-yel);outline-offset:-2px}
.oc-det{border-top:1px solid var(--oc-line);padding:4px 12px 10px;max-height:46vh;overflow:auto}
.oc-grp{display:grid;grid-template-columns:minmax(0,7.5em) minmax(0,1fr);gap:4px 10px;align-items:start;padding:7px 0;border-top:1px solid var(--oc-line)}
.oc-grp:first-child{border-top:0}
.oc-gl{font-size:.76rem;font-weight:700;color:var(--oc-mut);padding-top:4px;overflow-wrap:anywhere}
.oc-gl em{display:block;font-style:normal;font-weight:500;font-size:.7rem}
.oc-chips{display:flex;flex-wrap:wrap;gap:4px;min-width:0}
.oc-chip{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:5px;max-width:100%;padding:3px 8px;background:rgba(255,255,255,.09);color:var(--oc-ink);font-size:.78rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oc-chip:hover{background:rgba(255,255,255,.16)}
.oc-chip:focus-visible{outline:2px solid var(--oc-yel)}
.oc-chip i{flex:none;width:7px;height:7px;background:var(--c,#999)}
.oc-chip.un{background:none;border:1px dashed rgba(255,194,179,.55)}
.oc-chip.rt svg{width:12px;height:12px;flex:none;color:var(--oc-yel)}
.oc-chip.np{opacity:.7}
.oc-note{font-size:.72rem;color:var(--oc-mut);margin:6px 0 0}
.mapwrap.fs .outcard{display:none}
@media (max-width:380px){.oc-k{padding:9px 9px}.oc-k b{font-size:1.2rem}}
.obadge{display:inline-block;margin-left:5px;min-width:16px;padding:0 4px;background:#C8361D;color:#fff;font-size:.7rem;line-height:16px;text-align:center}
.floors.has3d{grid-template-columns:repeat(var(--n),minmax(0,1fr)) 52px;grid-auto-flow:row}
.floors .stkbtn{font-weight:800;letter-spacing:.04em}
.stksheet{overflow:hidden}
.stack3d{perspective:1300px;perspective-origin:50% 10%;padding:9% 16% 4%;overflow:hidden;touch-action:pan-y}
.stk-scene{position:relative;transform-style:preserve-3d;transform:rotateX(57deg) rotateZ(-34deg);--gap:clamp(46px,15vw,110px);animation:stkFloat 7s ease-in-out infinite}
@keyframes stkFloat{50%{transform:rotateX(55deg) rotateZ(-28deg)}}
.stk-layer{position:absolute;display:block;padding:0;border:0;background:#fff;cursor:pointer;transform:translateZ(calc(var(--i) * var(--gap)));transform-style:preserve-3d;outline:1px solid rgba(43,42,39,.25);box-shadow:0 18px 30px rgba(43,42,39,.25)!important;transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .35s;animation:stkIn .9s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i) * .1s)}
.stk-layer:first-child{position:relative;width:100%}
.stk-layer img{display:block;width:100%;height:100%;object-fit:fill;pointer-events:none}
.stk-layer:not(:first-child) img{opacity:.94}
.stk-layer.cur{outline:2px solid var(--ink)}
@keyframes stkIn{from{transform:translateZ(0);opacity:0}}
.stk-dots i{position:absolute;width:2.6%;aspect-ratio:1;background:var(--c,#999);transform:translate(-50%,-50%) translateZ(2px);outline:1px solid #fff;pointer-events:none}
.stk-dots i.off{background:#555;outline-color:#C8361D}
.stk-name{position:absolute;left:0;bottom:100%;background:var(--ink);color:#fff;font:700 clamp(10px,2.6vw,13px)/1.4 Manrope,system-ui,sans-serif;padding:2px 8px;white-space:nowrap;pointer-events:none}
.stk-scene.pick{animation:none}
.stk-scene.pick .stk-layer{opacity:0}
.stk-scene.pick .stk-layer.picked{opacity:1;transform:translateZ(calc(var(--i) * var(--gap) + 140px))}
.stk-hint{text-align:center;margin:4px 0 10px}
@media (prefers-reduced-motion:reduce){.stk-scene,.stk-layer{animation:none}}

/* ===== 3D-Räume ===== */
.s3dbar{display:flex;align-items:center;gap:0;background:#fff;border:1px solid var(--line);border-top:0;margin-bottom:0}
.s3dbar .btn{border:0;border-right:1px solid var(--line);height:44px;padding:0 14px;font-weight:700}
.s3dbar .mb-btn{border-left:1px solid var(--line)}
.wslider{flex:1;display:flex;align-items:center;gap:8px;padding:0 10px;min-width:0}
.wslider svg{width:20px;height:20px;flex:none;color:var(--muted)}
.wslider input{flex:1;min-width:0;accent-color:#131C2B}
.s3d{position:relative;height:min(72vh,620px);overflow:hidden;perspective:1700px;perspective-origin:50% 30%;background:linear-gradient(#EEF2F7,#DCE7F6);border:1px solid var(--line);border-top:0;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.s3d:active{cursor:grabbing}
.s3d-cam{position:absolute;left:50%;top:44%;width:0;height:0;transform-style:preserve-3d}
.s3d-world{position:absolute;transform-style:preserve-3d}
.s3d .f{position:absolute;display:block;transform-origin:0 0;outline:.6px solid rgba(43,42,39,.12)}
.s3d img.f{outline:0;box-shadow:0 30px 60px rgba(43,42,39,.18)!important}
.s3d .f.stick{background:rgba(43,42,39,.55);outline:0}
.m3layer{position:absolute;inset:0;pointer-events:none;z-index:4}
.s3d .f.anc{width:1px;height:1px;outline:0;background:none}
.m3d{position:absolute;padding:0;border:0;background:none;cursor:pointer;pointer-events:auto;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center}
.m3d .head{width:26px;height:26px;display:grid;place-items:center;background:var(--c,var(--other));color:#fff;border:2px solid #fff;outline:1px solid rgba(43,42,39,.4)}
.m3d .head svg{width:15px;height:15px}
.m3d .head.hasimg{padding:0;overflow:hidden}
.m3d .head img{width:100%;height:100%;object-fit:cover}
.lbl3{margin-top:3px;background:#fff;border:1px solid var(--line);font:600 10px/1.3 Manrope,system-ui,sans-serif;padding:0 4px;white-space:nowrap;color:var(--ink)}

.m3d.off .head{filter:grayscale(1) brightness(.7);outline:2px solid #C8361D}
.m3d.flash .head{animation:flash .8s ease-in-out 3}
.s3d .dl{z-index:2;opacity:.45}
.mapwrap:has(#s3d) .mb-edit,.mapwrap:has(#s3d) .mb-zoom,.mapwrap:has(#s3d) .placehint:not(.outhint){display:none}
.s3d .dl-tint{mix-blend-mode:multiply}
.s3d .sunb{z-index:3}
.s3dhint{position:absolute;left:0;right:0;bottom:6px;margin:0;text-align:center;font-size:.72rem;color:var(--muted);pointer-events:none;z-index:3}
.lampopt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;margin:0 0 12px;border:1px solid var(--line);background:#fff;cursor:pointer}
.lampopt input{width:20px;height:20px;margin:1px 0 0;accent-color:#131C2B;flex:none}
.lampopt span{display:flex;flex-direction:column;font-weight:600;font-size:.9rem}
.lampopt small{font-weight:400;color:var(--muted);font-size:.78rem;margin-top:2px}
.dl-glow{animation:breathe 4.5s ease-in-out infinite}
@keyframes breathe{50%{opacity:.82}}
@media (prefers-reduced-motion:reduce){.dl-glow{animation:none}}
.s3d .f.pool{outline:0;border-radius:50%!important;background:radial-gradient(circle,rgba(255,236,180,.95) 0%,rgba(255,196,100,.75) 22%,rgba(255,170,70,.3) 55%,rgba(255,170,70,0) 72%);pointer-events:none}
.m3d.glow .head{box-shadow:0 0 0 3px rgba(255,236,180,.9),0 0 26px 14px rgba(255,190,90,.95)!important}
.m3d.behind{opacity:.38;transform:translate(-50%,-100%) scale(.78)}
.m3d.behind .head{outline:1.5px dashed rgba(43,42,39,.7);box-shadow:none!important}
.m3d.behind .lbl3{display:none}
.m3d{transition:opacity .15s}

/* ===== Übersicht ===== */
.hm-hello{position:relative;overflow:hidden;background:#131C2B;color:#fff;padding:16px 16px 14px;margin-bottom:12px}
.hm-hello.day{background:linear-gradient(160deg,#3A3631,#131C2B)}
.hm-hello.night{background:linear-gradient(160deg,#1E2348,#131C2B)}
.hm-hello h2{margin:0 0 4px;font-size:1.3rem}
.hm-hello p{margin:0;font-size:.82rem;opacity:.8}
.hm-hello .hm-sub{margin-top:6px;opacity:.95;font-weight:600}
.hm-sun{position:absolute;right:16px;top:14px;width:38px;height:38px;background:#F2B544;border-radius:50%!important;box-shadow:0 0 34px 10px rgba(242,181,68,.45)!important}
.hm-hello.night .hm-sun{background:transparent;box-shadow:inset -9px -3px 0 0 #F4E9C8!important}
.hm-card{display:block;width:100%;text-align:left;background:#fff;box-shadow:0 2px 4px rgba(43,42,39,.07),0 12px 28px rgba(43,42,39,.12)!important;padding:12px 14px;margin-bottom:12px;border:0;color:var(--ink);font:inherit}
.hm-score{display:flex;align-items:center;gap:14px;cursor:pointer}
.hm-ring{width:66px;height:66px;flex:none;color:var(--ink)}
.hm-score b{font-size:1rem}
.hm-score small{display:block;color:var(--muted);font-size:.78rem;line-height:1.4;margin-top:2px}
.hm-parts{margin-top:-6px}
.hm-prow{display:grid;grid-template-columns:1fr auto;gap:3px 8px;width:100%;border:0;background:none;padding:6px 0;font:inherit;font-size:.85rem;color:var(--ink);text-align:left;cursor:pointer}
.hm-prow:disabled{cursor:default;opacity:.75}
.hm-prow em{font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums}
.hm-bar{display:block;grid-column:1/-1;height:6px;background:var(--line)}
.hm-bar i{display:block;height:100%}
.hm-floors{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:8px;margin-bottom:12px}
.hm-fl{display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:#fff;border:0;padding:10px;font:inherit;font-size:.74rem;font-weight:600;color:var(--ink);text-align:left;cursor:pointer;min-width:0;box-shadow:0 2px 4px rgba(43,42,39,.07),0 12px 28px rgba(43,42,39,.12)!important}
.hm-fl span:first-child{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
